name: Build WebView Tester APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK folder
        run: |
          mkdir -p APK
          find app/build/outputs/apk/debug -name "*.apk"
          cp app/build/outputs/apk/debug/app-debug.apk APK/WebViewTester.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebViewTester-APK
          path: APK/WebViewTester.apk
